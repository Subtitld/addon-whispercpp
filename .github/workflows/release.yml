name: Release

# Copyright 2026 Subtitld contributors
# SPDX-License-Identifier: Apache-2.0
#
# test -> build (one per platform, needs: test) -> release (tags only),
# with a source archive alongside.
#
# The build job does not trust a handshake-only smoke test: whisper.cpp's
# native libraries are only dlopen'ed at first transcription, so a bundle
# missing one starts, says hello, and fails on the user's first click. Every
# platform's FROZEN binary, unpacked from the release zip the way Subtitld
# installs it, therefore runs the subprocess test suite, including a real
# transcription with ggml-tiny.bin downloaded through it, before anything is
# published.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The decode, download and transcription tests shell out to ffmpeg.
      # Without it they skip themselves and the build would ship untested.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test suite (includes real tiny-model transcription)
        env:
          WHISPERCPP_TEST_TRANSCRIPTION: '1'
          WHISPERCPP_TEST_MODELS_DIR: ${{ runner.temp }}/whispercpp-models
        run: pytest -q -rs --junitxml=report.xml

      - name: Refuse skipped tests
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('report.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          tests = sum(int(s.get('tests', 0)) for s in suites)
          print(f'{tests} tests, {skipped} skipped')
          if skipped:
              sys.exit('FATAL: tests were skipped; the release would ship partly untested')
          PY

  build:
    name: Build ${{ matrix.platform_label }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform_label: linux-x86_64
            exe_suffix: ''
          # pywhispercpp 1.5.1 publishes arm64 macOS wheels only, and the
          # catalog cannot tell Mac architectures apart: ship arm64.
          - os: macos-14
            platform_label: macos-arm64
            exe_suffix: ''
          - os: windows-2022
            platform_label: windows-x86_64
            exe_suffix: '.exe'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ffmpeg is for the tests only; it is not bundled. The host passes its
      # own via SUBTITLD_FFMPEG_EXECUTABLE.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install build deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[build,dev]'
          python -c "from importlib.metadata import version as v; import shutil; print('pywhispercpp', v('pywhispercpp'), '| numpy', v('numpy'), '| pyinstaller', v('pyinstaller'), '| ffmpeg', shutil.which('ffmpeg'))"

      - name: Build bundle
        shell: bash
        run: pyinstaller pyinstaller.spec --noconfirm

      - name: Assemble third-party licences
        shell: bash
        # Fails the build when a required notice is missing.
        run: python tools/fetch_third_party_licenses.py --out release-staging/THIRD_PARTY_LICENSES

      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          mkdir -p release-staging/bin
          cp -R dist/whispercpp-addon/. release-staging/bin/
          cp LICENSE README.md release-staging/
          # The host resolves `executable` verbatim (manifest dir / path) and
          # never appends `.exe`, so the Windows archive names the real file.
          python - "${{ matrix.exe_suffix }}" <<'PY'
          import json, sys
          suffix = sys.argv[1]
          manifest = json.load(open('manifest.json', encoding='utf-8'))
          manifest['executable'] += suffix
          with open('release-staging/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print('executable:', manifest['executable'])
          PY
          test -f "release-staging/bin/whispercpp-addon${{ matrix.exe_suffix }}"
          archive="whispercpp-${version}-${{ matrix.platform_label }}.zip"
          python tools/make_archive.py release-staging "$archive"
          echo "ARCHIVE_NAME=$archive" >> "$GITHUB_ENV"

      - name: Report sizes
        shell: bash
        run: |
          python - <<'PY'
          import os
          def tree_size(path):
              total = 0
              for d, _, files in os.walk(path):
                  for f in files:
                      p = os.path.join(d, f)
                      if not os.path.islink(p):
                          total += os.path.getsize(p)
              return total
          onedir = tree_size('dist/whispercpp-addon')
          archive = os.path.getsize(os.environ['ARCHIVE_NAME'])
          line = (f"{os.environ['ARCHIVE_NAME']}: onedir {onedir:,} bytes "
                  f"({onedir / 2**20:.1f} MiB), archive {archive:,} bytes ({archive / 2**20:.1f} MiB)")
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(line + '\n')
          PY

      - name: Show native library linkage (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L release-staging/bin/_internal/_pywhispercpp*.so || true
          ls -la release-staging/bin/_internal/pywhispercpp/.dylibs || true

      # Exactly what Subtitld's installer does: ZipFile.extractall (no
      # symlinks, no permission bits), then chmod +x on the executable only.
      - name: Install the archive like the host
        shell: bash
        run: |
          python - "${{ runner.temp }}/installed" <<'PY'
          import json, os, sys, zipfile
          dest = sys.argv[1]
          with zipfile.ZipFile(os.environ['ARCHIVE_NAME']) as zf:
              zf.extractall(dest)
              exe = os.path.join(dest, json.loads(zf.read('manifest.json'))['executable'])
          os.chmod(exe, os.stat(exe).st_mode | 0o111)
          print('installed', exe)
          PY

      - name: Prove the frozen binary actually transcribes
        shell: bash
        env:
          WHISPERCPP_TEST_TRANSCRIPTION: '1'
          # Absolute: Popen resolves a relative exe against the CURRENT cwd,
          # not the cwd= it is handed.
          WHISPERCPP_TEST_BINARY: ${{ runner.temp }}/installed/bin/whispercpp-addon${{ matrix.exe_suffix }}
          WHISPERCPP_TEST_MODELS_DIR: ${{ runner.temp }}/whispercpp-models
          # The runners keep CA certificates where the bundled OpenSSL looks
          # for them; a Flatpak runtime, Fedora, Arch or a stock Mac does not.
          # Point OpenSSL's defaults at nothing so the model download below
          # has to succeed with the bundled certifi alone.
          SSL_CERT_FILE: ${{ runner.temp }}/no-such-ca.pem
          SSL_CERT_DIR: ${{ runner.temp }}/no-such-ca-dir
        run: |
          set -euo pipefail
          # The whole subprocess suite runs against the frozen binary; the
          # first transcription downloads ggml-tiny.bin through it.
          pytest -v -rs tests/test_addon.py --junitxml=frozen-report.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('frozen-report.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          if skipped:
              sys.exit(f'FATAL: {skipped} frozen-binary test(s) skipped')
          PY

      - name: Assert the archive is complete
        shell: bash
        env:
          EXE_SUFFIX: ${{ matrix.exe_suffix }}
          PLATFORM_LABEL: ${{ matrix.platform_label }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys, zipfile
          name = os.environ['ARCHIVE_NAME']
          suffix = os.environ['EXE_SUFFIX']
          platform = os.environ['PLATFORM_LABEL'].split('-')[0]
          zf = zipfile.ZipFile(name)
          names = set(zf.namelist())
          manifest = json.loads(zf.read('manifest.json'))
          repo_manifest = json.load(open('manifest.json', encoding='utf-8'))
          problems = []
          if manifest['version'] != repo_manifest['version']:
              problems.append('manifest version mismatch')
          if manifest['executable'] != f'bin/whispercpp-addon{suffix}':
              problems.append(f"executable is {manifest['executable']!r}")
          required = ['manifest.json', 'LICENSE', 'README.md',
                      manifest['executable'],
                      'THIRD_PARTY_LICENSES/README.md',
                      'THIRD_PARTY_LICENSES/whisper.cpp/LICENSE',
                      'THIRD_PARTY_LICENSES/openai-whisper/LICENSE',
                      'THIRD_PARTY_LICENSES/python-runtime-libs/openssl-LICENSE.txt']
          problems += [f'missing {r}' for r in required if r not in names]
          patterns = {
              'pywhispercpp licence': r'^THIRD_PARTY_LICENSES/pywhispercpp-1\.5\.1/LICENSE$',
              'numpy/OpenBLAS licence': r'^THIRD_PARTY_LICENSES/numpy-[^/]+/LICENSE\.txt$',
              'python licence': r'^THIRD_PARTY_LICENSES/python-[^/]+/LICENSE\.txt$',
              'pywhispercpp dist-info': r'^bin/_internal/pywhispercpp-1\.5\.1\.dist-info/METADATA$',
              'extension module': r'^bin/_internal/_pywhispercpp\.',
          }
          if platform == 'linux':
              patterns.update({
                  'libwhisper': r'^bin/_internal/pywhispercpp\.libs/libwhisper-[^/]+\.so',
                  'libggml-cpu': r'^bin/_internal/pywhispercpp\.libs/libggml-cpu-[^/]+\.so',
                  'libgomp': r'^bin/_internal/pywhispercpp\.libs/libgomp-[^/]+\.so',
                  'GCC runtime licence': r'^THIRD_PARTY_LICENSES/gcc-runtime/COPYING\.RUNTIME$',
              })
          elif platform == 'macos':
              patterns.update({
                  'libwhisper': r'^bin/_internal/pywhispercpp/\.dylibs/libwhisper[^/]*\.dylib$',
                  'libggml-cpu': r'^bin/_internal/pywhispercpp/\.dylibs/libggml-cpu[^/]*\.dylib$',
              })
          elif platform == 'windows':
              patterns.update({
                  'whisper.dll': r'^bin/_internal/whisper-[^/]+\.dll$',
                  'ggml-cpu.dll': r'^bin/_internal/ggml-cpu-[^/]+\.dll$',
                  'vcomp140.dll': r'^bin/_internal/vcomp140-[^/]+\.dll$',
                  'msvcp140.dll': r'^bin/_internal/msvcp140-[^/]+\.dll$',
                  'MSVC notice': r'^THIRD_PARTY_LICENSES/msvc-runtime/NOTICE\.txt$',
              })
          for label, pattern in patterns.items():
              if not any(re.search(pattern, n) for n in names):
                  problems.append(f'missing {label} ({pattern})')
          if problems:
              sys.exit('FATAL: ' + '; '.join(problems))
          print(f'{name}: {len(names)} entries, all required files present')
          PY

      - name: Checksum
        shell: bash
        run: |
          python -c "import hashlib,os;p=os.environ['ARCHIVE_NAME'];print(hashlib.sha256(open(p,'rb').read()).hexdigest())" > "${ARCHIVE_NAME}.sha256"
          cat "${ARCHIVE_NAME}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_label }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  source:
    name: Source archive
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build source tarball
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          out="whispercpp-addon-${version}-source.tar.gz"
          git archive --format=tar.gz --prefix="addon-whispercpp-${version}/" -o "$out" HEAD
          python3 -c "import hashlib,sys;p=sys.argv[1];print(hashlib.sha256(open(p,'rb').read()).hexdigest())" "$out" > "$out.sha256"
          ls -lah "$out"
          echo "SOURCE_NAME=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            ${{ env.SOURCE_NAME }}
            ${{ env.SOURCE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Flatten
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "FATAL: tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi
          mkdir -p release-files
          find artefacts -type f -name 'whispercpp-*' -print -exec cp {} release-files/ \;
          ls -lah release-files
          # Every advertised platform must be present, each with its sidecar,
          # or the catalog silently drops that platform.
          for label in linux-x86_64 macos-arm64 windows-x86_64; do
            test -f "release-files/whispercpp-${version}-${label}.zip"
            test -f "release-files/whispercpp-${version}-${label}.zip.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Offline speech-to-text for Subtitld with whisper.cpp (pywhispercpp 1.5.1).

            Models are not included: the selected GGML model downloads once on first
            use into Subtitld's shared model cache, so models downloaded by earlier
            Subtitld versions are reused.

            The add-on is Apache-2.0. Each archive contains `THIRD_PARTY_LICENSES/`
            with the licences of everything frozen into it (whisper.cpp and
            pywhispercpp are MIT; numpy and its OpenBLAS are BSD-3-Clause).
